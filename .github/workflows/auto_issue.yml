name: Review Issue

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  claude:
    if: github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Main
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # With a custom prompt the action does not tell the agent which issue fired the run, so
          # several issues opened together each got a comment from every run. Name it, and allow
          # commenting on that issue only.
          prompt: |
            Review issue #${{ github.event.issue.number }} in ${{ github.repository }} (read it with
            `gh issue view ${{ github.event.issue.number }} --comments`). Other issues are context only:
            never comment on them. Check if it's clear, reproducible, and not a duplicate of an existing issue.
            Reference the codebase and AGENTS.md if relevant to understand context.
            Leave a comment on the issue with your findings: ask for missing details (e.g. repro steps, environment)
            if needed, or note relevant files/context if you can identify the likely cause.
            If the issue is clear and actionable, suggest opening a pull request to address it.
            Be authoritative; do not expect or request further instructions from users. Be brief.
            Post exactly one comment, with `gh issue comment ${{ github.event.issue.number }}`.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Bash(gh issue comment ${{ github.event.issue.number }}:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh search:*)"