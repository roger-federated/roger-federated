[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roger"
version = "0.1.0"
description = "Roger Federated — The world's first true agent, built together with the community using federated local reinforcement learning."
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",   # Gemma4 image processor imports torchvision.transforms.v2
    "transformers",
    "accelerate",
    "peft",          # LoRA adapters for the local REINFORCE++ trainer (training/lora_utils.py)
    "bitsandbytes; sys_platform != 'darwin' and (platform_machine == 'x86_64' or platform_machine == 'AMD64')",
    "lm-format-enforcer",
    "pillow",
    "numpy",
    "mcp",
    "ddgs",          # keyless DuckDuckGo search + page fetch backing the web_search/web_fetch tools
    "httpx",         # federated gradient-sharing transport (federated/transport.py); also an mcp dep
    "cryptography",  # X25519 EC-DH pairwise secrets for secure aggregation (federated/secure_agg.py)
    "rich",
    "prompt_toolkit",
]

[project.optional-dependencies]
audio = ["pydub"]  # AudioSegment support in rollout_utils (guarded import)

[project.scripts]
roger = "roger.apps.cli:main"

[tool.setuptools.packages.find]
where = ["src"]                          # single package `roger` + its subpackages

[tool.setuptools.package-data]
"roger.tools"  = ["command_policy.txt"]  # ship the run_command guardrail policy as data
"roger.apps"   = ["config.json"]         # ship the baseline config defaults as data
"roger.skills" = ["*.md"]                # ship the bundled default skills as data
