[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roger"
version = "0.1.0"
description = "Roger Federated — The world's first true agent, built together with the community using federated local reinforcement learning."
requires-python = ">=3.10"
dependencies = [
    # The wrapper itself needs only the five light ones below; everything else is the post-exit
    # training round (training/), imported lazily so `roger <runtime>` starts in well under a second.
    "httpx",         # the reverse proxy + federated transport (runtime/proxy.py, federated/transport.py)
    "numpy",         # builds the runtime's LoRA adapter without torch (runtime/adapter.py)
    "safetensors",   # the federated wire format, read torch-free by runtime/adapter.py
    "gguf",          # writes llama.cpp LoRA adapters for the federation update (runtime/adapter.py)
    "cryptography",  # X25519 EC-DH pairwise secrets for secure aggregation (federated/secure_agg.py)
    "torch",
    "transformers",  # dequantizes llama-server's GGUF for the training round (gguf_file=); gemma-4 GGUFs
                     # need the gemma4 tensor processor, on main but not yet in 5.17.0
    "accelerate",    # device_map="auto" offload when the trained model outgrows the GPU
    "peft",          # the LoRA adapter the round trains (training/lora_utils.py)
    "bitsandbytes; sys_platform != 'darwin' and (platform_machine == 'x86_64' or platform_machine == 'AMD64')",
]

[project.scripts]
roger = "roger.runtime.wrapper:main"   # the `roger <runtime-command> …` wrapper

[tool.setuptools.packages.find]
where = ["src"]                          # single package `roger` + its subpackages

[tool.setuptools.package-data]
"roger" = ["config.json"]                # ship the baseline config defaults as data
